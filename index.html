<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timecard | Sakura Mart</title>
    <meta name="theme-color" content="#76afd2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sakura Mart">
    <script>
      const manifestParams = new URLSearchParams(window.location.search);
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = manifestParams.get("terminal") === "1"
        ? manifestParams.get("mode") === "test"
          ? "./manifest-terminal-test.webmanifest"
          : "./manifest-terminal.webmanifest"
        : "./manifest.webmanifest";
      document.head.appendChild(manifestLink);
    </script>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      const script = document.createElement("script");
      script.type = "module";
      script.src = isLocal ? "/src/main.jsx" : "./assets/app.js";
      document.body.appendChild(script);

      if (!isLocal) {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "./assets/app.css";
        document.head.appendChild(stylesheet);
      }
    </script>
  </body>
</html>
